name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: make cross VERSION=${{ github.ref_name }}

      - name: Fetch databases from their publishers
        env:
          CII_IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          set -euo pipefail
          sources="dbip-country-lite dbip-asn-lite"
          if [ -n "$CII_IPINFO_TOKEN" ]; then sources="$sources ipinfo-lite"; fi
          ./dist/cii-linux-amd64 data update --no-color --data-dir data $sources
          for f in data/*.mmdb; do gzip -9 -c "$f" > "dist/$(basename "$f").gz"; done
          cp data/manifest.json dist/data-manifest.json
          cd dist && sha256sum cii-* *.mmdb.gz data-manifest.json > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --notes-file docs/RELEASE_NOTES_TEMPLATE.md
