name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad tag"; exit 1; }'
      - run: make check
      - run: make cross VERSION="$TAG"
        env:
          TAG: ${{ github.ref_name }}

      - name: Fetch databases from their publishers
        env:
          CII_IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          set -euo pipefail
          sources="dbip-country-lite dbip-asn-lite"
          if [ -n "$CII_IPINFO_TOKEN" ]; then sources="$sources ipinfo-lite"; fi
          ./dist/cii-linux-amd64 data update --no-color --data-dir data $sources
          for f in data/*.mmdb; do gzip -9 -c "$f" > "dist/$(basename "$f").gz"; done
          cp data/manifest.json dist/data-manifest.json

      - name: License and attribution notices
        run: |
          set -euo pipefail
          go run ./tools/notices licenses dist/THIRD_PARTY_LICENSES.txt
          go run ./tools/notices data data dist/DATA-NOTICE.txt

      - name: Build deb, rpm and apk packages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          PATH="$PATH:$(go env GOPATH)/bin" packaging/build-packages.sh "$TAG"

      - name: Checksums and package manager manifests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum cii* *.mmdb.gz data-manifest.json DATA-NOTICE.txt THIRD_PARTY_LICENSES.txt > SHA256SUMS)
          packaging/render-manifests.sh "$TAG"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            body=$(gh release view "$TAG" --json body --jq .body)
            if [ -z "$body" ]; then
              gh release edit "$TAG" --notes-file docs/RELEASE_NOTES_TEMPLATE.md
            fi
            title=$(gh release view "$TAG" --json name --jq .name)
            if [ -z "$title" ]; then
              gh release edit "$TAG" --title "cii $TAG"
            fi
          else
            gh release create "$TAG" dist/* \
              --title "cii $TAG" \
              --notes-file docs/RELEASE_NOTES_TEMPLATE.md
          fi

      - name: Publish the container image
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}
          SOURCE: https://github.com/${{ github.repository }}
          DESCRIPTION: "cii: complete information about current IP (region, IP quality, services, censorship, routes, benchmark)"
        run: |
          set -euo pipefail
          ctx=$(mktemp -d)
          cp dist/cii-linux-amd64 dist/cii-linux-arm64 packaging/Dockerfile "$ctx/"
          cp /etc/ssl/certs/ca-certificates.crt "$ctx/"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          tags=(-t "$IMAGE:${TAG#v}")
          case "$TAG" in
            *-*) ;;
            *) tags+=(-t "$IMAGE:latest") ;;
          esac
          docker buildx create --use >/dev/null
          docker buildx build --platform linux/amd64,linux/arm64 "${tags[@]}" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
            --label "org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            --push "$ctx"

      - name: Update the Homebrew formula and Scoop manifest in the repository
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *-*) echo "pre-release: package manifests are not updated"; exit 0 ;;
          esac
          git fetch origin main
          git checkout -B package-manifests origin/main
          mkdir -p Formula bucket
          cp dist/cii.rb Formula/cii.rb
          cp dist/cii.json bucket/cii.json
          git add Formula/cii.rb bucket/cii.json
          if git diff --cached --quiet; then
            echo "package manifests already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update Homebrew formula and Scoop manifest for $TAG"
          git push origin HEAD:main
