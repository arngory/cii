name: cii
arch: @ARCH@
platform: linux
version: @VERSION@
section: net
priority: optional
maintainer: arngory <https://github.com/arngory>
description: |
  Complete information about the current IP address: region as seen by
  GeoIP databases and services, service availability, IP quality and
  reputation, censorship checks and benchmarks. Contacts only the
  destinations listed by `cii --plan`.
vendor: arngory
homepage: https://github.com/arngory/cii
license: AGPL-3.0-only
contents:
  - src: @BINARY@
    dst: /usr/bin/cii
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/licenses/cii/LICENSE
  - src: dist/THIRD_PARTY_LICENSES.txt
    dst: /usr/share/licenses/cii/THIRD_PARTY_LICENSES.txt
  - src: README.md
    dst: /usr/share/doc/cii/README.md
  - src: build/share/cii.1.gz
    dst: /usr/share/man/man1/cii.1.gz
  - src: build/share/cii.bash
    dst: /usr/share/bash-completion/completions/cii
  - src: build/share/_cii
    dst: /usr/share/zsh/vendor-completions/_cii
    packager: deb
  - src: build/share/_cii
    dst: /usr/share/zsh/site-functions/_cii
    packager: rpm
  - src: build/share/_cii
    dst: /usr/share/zsh/site-functions/_cii
    packager: apk
  - src: build/share/cii.fish
    dst: /usr/share/fish/vendor_completions.d/cii.fish
